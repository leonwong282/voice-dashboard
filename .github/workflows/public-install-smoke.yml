name: Public Install Smoke

on:
  workflow_dispatch:
    inputs:
      package_spec:
        description: "Package spec to install, such as voice-dashboard==0.4.0"
        required: true
        default: "voice-dashboard"
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify published install paths
        run: |
          python scripts/verify_public_install.py \
            --package-spec "${{ inputs.package_spec }}"
