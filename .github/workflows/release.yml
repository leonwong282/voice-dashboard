name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          package_version="$(python -c 'from voice_dashboard import __version__; print(__version__)')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "Tag version ($tag_version) does not match package version ($package_version)." >&2
            exit 1
          fi

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate source tree and build artifacts
        run: make check release-smoke

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

      - name: Generate artifact checksums
        run: sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v6
        with:
          name: checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error

  public-install-smoke:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pypi-publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify published pip and pipx install paths
        run: |
          python scripts/verify_public_install.py \
            --package-spec "voice-dashboard==${GITHUB_REF_NAME#v}" \
            --attempts 10 \
            --retry-delay-seconds 15

  homebrew-formula:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pypi-publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install script dependencies
        run: python -m pip install -e .

      - name: Render Homebrew formula for this tag
        run: |
          mkdir -p release-assets
          python scripts/render_homebrew_formula.py \
            --package-version "${GITHUB_REF_NAME#v}" \
            --output release-assets/voice-dashboard.rb

      - name: Upload Homebrew formula artifact
        uses: actions/upload-artifact@v6
        with:
          name: homebrew-formula
          path: release-assets/voice-dashboard.rb
          if-no-files-found: error

  homebrew-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - pypi-publish
      - public-install-smoke
      - homebrew-formula
    runs-on: ubuntu-latest

    steps:
      - name: Require tap publish token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "Missing repository secret HOMEBREW_TAP_TOKEN." >&2
            echo "Create a fine-grained GitHub token with contents write access to leonwong282/homebrew-tap." >&2
            exit 1
          fi

      - name: Download Homebrew formula artifact
        uses: actions/download-artifact@v8
        with:
          name: homebrew-formula
          path: release-assets

      - name: Check out Homebrew tap
        uses: actions/checkout@v5
        with:
          repository: leonwong282/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          persist-credentials: false

      - name: Update tap formula
        id: tap-update
        working-directory: homebrew-tap
        run: |
          mkdir -p Formula
          cp "$GITHUB_WORKSPACE/release-assets/voice-dashboard.rb" Formula/voice-dashboard.rb
          if [ -n "$(git status --porcelain -- Formula/voice-dashboard.rb)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push tap update
        if: steps.tap-update.outputs.changed == 'true'
        working-directory: homebrew-tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          remote_url="https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/leonwong282/homebrew-tap.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git ls-remote --exit-code "$remote_url" HEAD >/dev/null
          git add Formula/voice-dashboard.rb
          git commit -m "Update voice-dashboard ${GITHUB_REF_NAME#v}"
          git push "$remote_url" HEAD:$(git branch --show-current)

      - name: Report no-op tap publish
        if: steps.tap-update.outputs.changed != 'true'
        run: echo "Homebrew formula already matches the rendered release artifact."

  homebrew-install-smoke:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: homebrew-publish
    runs-on: macos-latest

    steps:
      - name: Tap published formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew tap leonwong282/tap

      - name: Install published Homebrew formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        run: brew install leonwong282/tap/voice-dashboard

      - name: Verify installed CLI
        run: |
          ttsrun --version
          ttsrun --help >/dev/null
          brew test leonwong282/tap/voice-dashboard

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - pypi-publish
      - public-install-smoke
      - homebrew-formula
      - homebrew-publish
      - homebrew-install-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Download checksum artifact
        uses: actions/download-artifact@v8
        with:
          name: checksums
          path: release-assets

      - name: Download Homebrew formula artifact
        uses: actions/download-artifact@v8
        with:
          name: homebrew-formula
          path: release-assets

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi

  pypi-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/voice-dashboard
    permissions:
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
