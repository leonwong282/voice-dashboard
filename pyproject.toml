[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-dashboard"
version = "0.1.0"
description = "Daily-friendly MiniMax batch TTS CLI"
requires-python = ">=3.10"
dependencies = ["requests>=2.31.0"]

[project.scripts]
ttsrun = "voice_dashboard.cli:main_entry"

[tool.setuptools]
packages = ["voice_dashboard"]
